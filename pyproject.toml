# ==============================================================================
# BUILD SYSTEM
#
# Canopus is a mixed Rust + Python project built via maturin. `pip install .`
# automatically pulls maturin into an isolated build env and produces an
# extension module at `canopus.utils._accel.{cpython-XYZ-<platform>}.{so,pyd}`.
#
# Building from source requires a Rust toolchain (rustup). Released wheels
# on PyPI are pre-compiled, so end users do NOT need Rust.
# ==============================================================================
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"


# ==============================================================================
# PROJECT METADATA (PEP 621)
#
# Distribution name (`pip install canopus-quantum`) intentionally differs from
# the import name (`import canopus`). The PyPI namespace `canopus` is taken,
# while the Python module name `canopus` is preserved for backward
# compatibility and brevity.
# ==============================================================================
[project]
name = "canopus-quantum"
version = "0.1.3"
description = "ISA-aware qubit mapping/routing framework tailored to advanced quantum instruction sets, built on canonical two-qubit gate representation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Zhaohui Yang", email = "youngcius007@gmail.com" },
]
maintainers = [
    { name = "Zhaohui Yang", email = "youngcius007@gmail.com" },
]
keywords = [
    "quantum-computing",
    "qubit-mapping",
    "qubit-routing",
    "quantum-isa",
    "quantum-compiler",
    "rust",
    "high-performance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Runtime dependencies — every entry must be installable from PyPI so that
# `pip install canopus-quantum` works out of the box.
#
# REQUIRED but NOT on PyPI (declared here for documentation only — users must
# install it manually before `import canopus` succeeds):
#   - monodromy (https://github.com/Youngcius/monodromy) — used at module
#     load time by canopus.synthesis and canopus.utils._core for Weyl-chamber
#     coverage computation. Building monodromy further requires the `lrs`
#     binary from lrslib; see README for platform-specific setup.
dependencies = [
    "qiskit>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "rustworkx>=0.14",
    "cirq-core>=1.3",
    "pytket>=1.20",
    "bqskit>=1.0",
    "prettytable>=3",
]


# ==============================================================================
# OPTIONAL DEPENDENCIES
# ==============================================================================
[project.optional-dependencies]
# Optimal synthesis onto arbitrary 2-qubit ISAs via GULPS. Only required when
# calling canopus.rebase_to_custom / two_qubit_unitary_to_custom_circuit.
# Imported lazily inside the function body so importing canopus does NOT
# require GULPS to be installed.
gulps = [
    "gulps>=0.3",
]

# Testing dependencies
test = [
    "pytest>=7",
    "pytest-cov>=4",
]

# Development dependencies (linting, type checking, build tooling)
dev = [
    "canopus-quantum[test,gulps]",
    "ruff>=0.6",
    "mypy>=1.10",
    "maturin>=1.5",
    "poethepoet>=0.27",
    "ipykernel>=6",
]


# ==============================================================================
# PROJECT URLS (shown on the PyPI sidebar)
# ==============================================================================
[project.urls]
Homepage      = "https://github.com/Youngcius/canopus"
Documentation = "https://github.com/Youngcius/canopus#readme"
Repository    = "https://github.com/Youngcius/canopus"
Issues        = "https://github.com/Youngcius/canopus/issues"
Changelog     = "https://github.com/Youngcius/canopus/blob/master/CHANGELOG.md"
Paper         = "https://arxiv.org/abs/2511.04608"


# ==============================================================================
# MATURIN CONFIGURATION
# ==============================================================================
[tool.maturin]
# Build the Rust extension as canopus.utils._accel
module-name = "canopus.utils._accel"
# Python source tree lives at the project root (i.e. ./canopus/...)
python-source = "."
# Required pyo3 feature to produce a CPython extension module
features = ["pyo3/extension-module"]
# Include the .pyi stub when building wheels so type checkers see correct signatures
include = ["canopus/utils/_accel.pyi"]


# ==============================================================================
# RUFF (lint + format)
#
# `ruff check canopus` enforces lint; `ruff format canopus` enforces style.
# CI runs both via `poe lint` / `poe fmt-check`.
# ==============================================================================
[tool.ruff]
src = ["canopus", "tests"]
line-length = 120
target-version = "py310"
# Skip research/experimental code from lint to keep the package surface clean
extend-exclude = ["experiments", "analysis", "examples", "backup", "lrslib-073"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # function calls in argument defaults — common in qiskit code
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"      = ["E402", "F401"]
"**/__init__.py"     = ["F401", "F403"]
"canopus/utils/_accel.pyi" = ["ALL"]
"canopus/basics.py"          = ["E741"]  # `I` is the conventional identity matrix in quantum computing
"canopus/extensions/bqskit.py" = ["B006"]  # mutable default `[]` matches bqskit base-class signature

# Note: isort's `known-first-party` is auto-derived from `[tool.ruff].src`
# (i.e. ["canopus", "tests"]), so no explicit `[tool.ruff.lint.isort]` block is needed.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true


# ==============================================================================
# PYTEST
# ==============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --color=yes"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:qiskit.*",
]


# ==============================================================================
# MYPY
# ==============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["experiments/", "analysis/", "examples/", "backup/", "build/", "lrslib-073/"]


# ==============================================================================
# POETHEPOET TASKS
#
# Convenience wrappers around common dev workflows. Invoke via `poe <task>`.
# ==============================================================================
[tool.poe.tasks]
# Build the Rust extension in editable mode (--release for optimized binaries)
dev      = { shell = "maturin develop --release" }
# Build a redistributable wheel into ./target/wheels/
build    = { shell = "maturin build --release" }
# Build wheels for the current platform across all Python versions (requires CI)
build-all = { shell = "maturin build --release --strip --interpreter python3.10 python3.11 python3.12 python3.13" }
# Remove every compiled artifact + cache
clean    = { shell = "cargo clean && rm -f canopus/utils/_accel*.so && rm -rf canopus/**/__pycache__ .pytest_cache .mypy_cache .ruff_cache build/ target/wheels/" }
# Full rebuild
rebuild  = { shell = "poe clean && poe dev" }
# Linters and formatters
lint       = { shell = "ruff check canopus" }
fmt        = { shell = "ruff format canopus" }
fmt-check  = { shell = "ruff format --check canopus" }
typecheck  = { shell = "mypy canopus" }
# Tests
test     = { shell = "pytest" }
test-cov = { shell = "pytest --cov=canopus --cov-report=term-missing" }
# Aggregate gate — what CI runs before merge
check    = { shell = "poe lint && poe fmt-check && poe test" }
