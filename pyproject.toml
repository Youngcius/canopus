# ==============================================================================
# BUILD SYSTEM CONFIGURATION
#
# Using maturin for mixed Rust + Python projects.
# ==============================================================================
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

# ==============================================================================
# PROJECT METADATA (PEP 621)
# ==============================================================================
[project]
name = "canopus"
version = "0.1.0"
description = "Canopus (Canonical Optimized Placement Utility Suite) is an ISA-aware qubit mapping/routing framework tailored to diverse quantum ISAs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Youngcius", email = "youngcius007@gmail.com" },
]
keywords = ["quantum-computing", "qubit-mapping", "quantum-isa", "rust", "high-performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

# ==============================================================================
# MATURIN CONFIGURATION
# ==============================================================================
[tool.maturin]
# Build the Rust extension as canopus.utils._accel
module-name = "canopus.utils._accel"
# Include Python source files
python-source = "."
# Features to enable
features = ["pyo3/extension-module"]

# ==============================================================================
# OPTIONAL DEPENDENCIES
# ==============================================================================
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "canopus[test]",
    "ruff",
    "mypy",
    "ipykernel",
    "maturin",
]

# ==============================================================================
# PROJECT URLS
# ==============================================================================
[project.urls]
Homepage = "https://github.com/Youngcius/canopus"
Repository = "https://github.com/Youngcius/canopus"
"Bug Tracker" = "https://github.com/Youngcius/canopus/issues"

# ==============================================================================
# DEVELOPMENT TOOLS CONFIGURATION
# ==============================================================================

[tool.ruff]
src = ["canopus"]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --color=yes"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ==============================================================================
# PROJECT SCRIPTS (via PDM/Hatch style using poe)
# ==============================================================================
[tool.poe.tasks]
# Clean all build artifacts
clean = { shell = "cargo clean && rm -f canopus/utils/_accel*.so && rm -rf __pycache__ canopus/**/__pycache__ .pytest_cache .mypy_cache .ruff_cache" }
# Build in development mode
dev = { shell = "maturin develop --release" }
# Build wheel for distribution
build = { shell = "maturin build --release" }
# Clean and rebuild
rebuild = { shell = "poe clean && poe dev" }
# Run tests
test = { shell = "pytest" }
# Format code
fmt = { shell = "ruff format canopus tests" }
# Lint code
lint = { shell = "ruff check canopus tests" }
