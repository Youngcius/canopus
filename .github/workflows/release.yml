name: Release

# Triggered by pushing a tag of the form `vX.Y.Z` (or manually via the
# Actions tab). On a successful run the workflow:
#   1. Builds wheels for Linux x86_64 and macOS arm64 across CPython
#      3.10 / 3.11 / 3.12 / 3.13. (macOS x86_64 is intentionally omitted —
#      Intel Macs have been declining fast and the macos-13 runner queue is
#      slow; Intel Mac users will install from sdist, which compiles locally.)
#   2. Builds a source distribution (sdist).
#   3. Publishes every artifact to PyPI via OIDC trusted publishing.
#
# === Prerequisites (do this once, BEFORE pushing a tag) ===
# 1. Reserve the project on PyPI:
#       https://pypi.org/manage/account/publishing/
#    Add a "pending publisher" for:
#       PyPI project name : canopus-quantum
#       Owner             : Youngcius
#       Repository        : canopus
#       Workflow          : release.yml
#       Environment       : pypi
# 2. Create a GitHub Environment called `pypi` under repo Settings → Environments.
#    No secrets are required — OIDC handles auth.
# 3. Push your first tag:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-flight release on the same tag if a new push lands.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Build native wheels via maturin across the supported OS × arch matrix.
  # Each cell builds wheels for CPython 3.10 – 3.13 in one shot using maturin's
  # multi-interpreter mode.
  # ============================================================================
  build-wheels:
    name: Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            maturin-target: x86_64-unknown-linux-gnu
            manylinux: auto
          - target: macos-arm64
            runner: macos-14
            maturin-target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin-target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --strip --out dist --interpreter python3.10 python3.11 python3.12 python3.13

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # ============================================================================
  # Source distribution. Built once, on Linux.
  # ============================================================================
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ============================================================================
  # Publish to PyPI via OIDC trusted publishing.
  # Requires the GitHub Environment `pypi` (no token secret needed).
  # ============================================================================
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canopus-quantum
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # skip-existing prevents the workflow from failing if a wheel was
          # already uploaded by a previous run on the same tag.
          skip-existing: true
