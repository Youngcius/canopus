name: Release

# Triggered by pushing a tag of the form `vX.Y.Z` (or manually via the
# Actions tab). On a successful run the workflow:
#   1. Builds wheels for Linux x86_64 and macOS arm64 across CPython
#      3.10 / 3.11 / 3.12 / 3.13. (macOS x86_64 is intentionally omitted —
#      Intel Macs have been declining fast and the macos-13 runner queue is
#      slow; Intel Mac users will install from sdist, which compiles locally.)
#   2. Builds a source distribution (sdist).
#   3. Tests the built wheels out-of-tree to ensure functionality.
#   4. Publishes every artifact to PyPI via OIDC trusted publishing.
#
# === Prerequisites (do this once, BEFORE pushing a tag) ===
# 1. Reserve the project on PyPI:
#       https://pypi.org/manage/account/publishing/
#    Add a "pending publisher" for:
#       PyPI project name : canopus-quantum
#       Owner             : Youngcius
#       Repository        : canopus
#       Workflow          : release.yml
#       Environment       : pypi
# 2. Create a GitHub Environment called `pypi` under repo Settings → Environments.
#    No secrets are required — OIDC handles auth.
# 3. Push your first tag:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    uses: ./.github/workflows/reusable-wheels.yml

  # ============================================================================
  # 构建 Sdist
  # ============================================================================
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build sdist
        run: uv build --sdist --out-dir dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ============================================================================
  # 发布到 PyPI (必须等待 build-wheels, build-sdist, 以及 test-wheels 成功)
  # ============================================================================
  publish:
    name: Publish to PyPI
    needs: [wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canopus-quantum
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Publish to PyPI
        run: uv publish dist/* --skip-existing