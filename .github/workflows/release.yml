name: Release

# Triggered by pushing a tag of the form `vX.Y.Z` (or manually via the
# Actions tab). On a successful run the workflow:
#   1. Builds wheels for Linux x86_64 and macOS arm64 across CPython
#      3.10 / 3.11 / 3.12 / 3.13. (macOS x86_64 is intentionally omitted —
#      Intel Macs have been declining fast and the macos-13 runner queue is
#      slow; Intel Mac users will install from sdist, which compiles locally.)
#   2. Builds a source distribution (sdist).
#   3. Publishes every artifact to PyPI via OIDC trusted publishing.
#
# === Prerequisites (do this once, BEFORE pushing a tag) ===
# 1. Reserve the project on PyPI:
#       https://pypi.org/manage/account/publishing/
#    Add a "pending publisher" for:
#       PyPI project name : canopus-quantum
#       Owner             : Youngcius
#       Repository        : canopus
#       Workflow          : release.yml
#       Environment       : pypi
# 2. Create a GitHub Environment called `pypi` under repo Settings → Environments.
#    No secrets are required — OIDC handles auth.
# 3. Push your first tag:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ============================================================================
  # 保持原样：构建 Wheel 依然使用 maturin-action
  # 原因：uv build 目前不负责底层的 manylinux docker 容器管理，
  # maturin 依然是 Rust 扩展跨平台构建的最佳工具。
  # ============================================================================
  build-wheels:
    name: Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            maturin-target: x86_64-unknown-linux-gnu
            manylinux: auto
          - target: macos-arm64
            runner: macos-14
            maturin-target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin-target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --strip --out dist --interpreter python3.10 python3.11 python3.12 python3.13
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
  # ============================================================================
  # ✨ uv 改造点 1：使用 uv 作为现代构建前端来打包 sdist
  # ============================================================================
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build sdist
        # uv 作为标准 PEP517 前端，会自动读取 pyproject.toml 调用 maturin 打包
        run: uv build --sdist --out-dir dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
  # ============================================================================
  # ✨ uv 改造点 2：完全使用 uv 原生能力发布到 PyPI
  # ============================================================================
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canopus-quantum
    permissions:
      id-token: write # 必须：授权 uv 使用 OIDC 与 PyPI 认证
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Publish to PyPI
        # uv publish 原生支持 OIDC，直接识别 GitHub Actions 环境
        run: uv publish dist/* --skip-existing