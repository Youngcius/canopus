name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag and package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require matching tag, Python, and Rust versions
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as file:
              python_version = tomllib.load(file)["project"]["version"]
          with open("Cargo.toml", "rb") as file:
              rust_version = tomllib.load(file)["package"]["version"]

          versions = {"tag": tag_version, "pyproject.toml": python_version, "Cargo.toml": rust_version}
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Version mismatch: {versions}")
          PY

  build-wheels:
    name: Build ${{ matrix.target }} wheels on ${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
          if-no-files-found: error

  publish:
    name: Publish release to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canopus-quantum
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
